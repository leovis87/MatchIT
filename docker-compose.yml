

services:
  # PostgreSQL 데이터베이스 (관계형 데이터)
  postgres:
    build:
      context: ./server/db
      dockerfile: Dockerfile
    # image을 명시하면 빌드 시 해당 이름으로 태깅됩니다. 만약 registry에서 이미 빌드된 이미지를 사용하고 싶다면
    # build를 제거하고 image만 남겨서 사용하세요 (예: himediaproject/matchit_postgres:18-pgvector)
    # 로컬에서 빌드한 이미지를 사용하려면 아래 `image` 이름을 사용해 빌드 및 태깅 후 docker compose up을 실행하면 됩니다.
    image: matchit_postgres:18-pgvector
    container_name: matchit_postgres
    environment:
      POSTGRES_DB: matchit_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      # Mount a single SQL init script so the container only executes the one intended file
      # If you want multiple files to be executed, you can mount a directory instead.
      - ./server/db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    networks:
      - matchit_network
    restart: unless-stopped

  # pgAdmin (PostgreSQL 관리 도구)
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: matchit_pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@matchit.com
      PGADMIN_DEFAULT_PASSWORD: admin123
      PGADMIN_CONFIG_SERVER_MODE: 'False'
      PGADMIN_CONFIG_LOGIN_BANNER: "'MatchIT PostgreSQL 관리 도구'"
      PGADMIN_CONFIG_MASTER_PASSWORD_REQUIRED: 'False'
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    networks:
      - matchit_network
    restart: unless-stopped

  # Redis 캐시
  redis:
    image: redis:7-alpine
    container_name: matchit_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - matchit_network
    restart: unless-stopped

  # Backend 서버
  server:
    build:
      context: ./server
      dockerfile: Dockerfile
    container_name: matchit_server
    ports:
      - "8000:8000"
    volumes:
      - ./server:/app
    environment:
      DB_HOST: postgres
      DB_USER: postgres
      DB_PASSWORD: password
      DB_NAME: matchit_db
      DB_PORT: 5432
      LORA_MODEL_PATH: /app/ai/models/checkpoint-460   #/app/ai/models/gemma2-job-lora-final
    depends_on:
      - postgres
      - redis
    gpus: all         # Docker Compose v2에서 사용 가능함
    shm_size: '2gb'   # 공유 메모리 크기 (PyTorch DataLoader에 필요)
    mem_limit: 8g     # 최대 메모리 제한 (8GB)
    memswap_limit: 8g # 스왑 메모리 제한
    networks:
      - matchit_network
    restart: unless-stopped

  # Frontend 클라이언트
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: matchit_frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend:/app
      - /app/node_modules  # 컨테이너 내부 node_modules는 호스트와 분리
    depends_on:
      - server
    networks:
      - matchit_network
    restart: unless-stopped
    command: npm start  # 개발 모드에서 실행 명확히 지정

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  matchit_network:
    driver: bridge
